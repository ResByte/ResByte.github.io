baseURL = "https://resbyte.github.io/"
title = "Abhinav Dadhich"
author = "Abhinav Dadhich"
theme = "hugo-bearblog"
locale = "en-us"
enableRobotsTXT = true

disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  blog = "/:slug/"

[params]
  description = "Writing about AI in healthcare, medical imaging, and clinical ML."
  dateFormat = "2006-01-02"
  enablePostNavigator = true
  hideMadeWithLine = true

  # Footer links (layouts/partials/footer.html)
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/Resbyte"
  [[params.social]]
    name = "LinkedIn"
    url = "https://linkedin.com/in/adadhich"
  [[params.social]]
    name = "Scholar"
    url = "https://scholar.google.com/citations?hl=en&user=azHefEoAAAAJ"

[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
    lineNumbersInTable = false
    codeFences = true
    noClasses = false   # colours come from assets/css/syntax.css (light + dark)
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
