{{ define "main" }}
{{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}

{{- $posts := where site.RegularPages "Section" "blog" }}
<section>
  <div class="section-head">
    <h2>Recent writing</h2>
    {{ with site.GetPage "/blog" }}<a href="{{ .RelPermalink }}">All posts →</a>{{ end }}
  </div>
  {{ partial "post_list.html" (first 5 $posts) }}
</section>
{{ end }}
