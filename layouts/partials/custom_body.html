<script>
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector(".theme-toggle");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function isDark() {
      var t = root.getAttribute("data-theme");
      return t ? t === "dark" : mq.matches;
    }
    function label() { if (btn) btn.textContent = isDark() ? "Light" : "Dark"; }
    label();
    if (mq.addEventListener) mq.addEventListener("change", label);
    if (btn) btn.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      label();
    });

    // Highlight the current section in the side-rail table of contents.
    var links = document.querySelectorAll('.rail a[href^="#"]');
    if (!links.length) return;
    var map = {};
    links.forEach(function (a) { map[decodeURIComponent(a.getAttribute("href").slice(1))] = a; });
    var heads = Array.prototype.filter.call(
      document.querySelectorAll("article h2[id], article h3[id]"),
      function (h) { return map[h.id]; }
    );
    function set(id) {
      links.forEach(function (a) { a.removeAttribute("aria-current"); });
      if (map[id]) map[id].setAttribute("aria-current", "true");
    }
    var ticking = false;
    function update() {
      ticking = false;
      var line = window.innerHeight * 0.3, current = heads[0];
      heads.forEach(function (h) { if (h.getBoundingClientRect().top <= line) current = h; });
      if (current) set(current.id);
    }
    window.addEventListener("scroll", function () {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, { passive: true });
    window.addEventListener("resize", update);
    update();
  })();
</script>
